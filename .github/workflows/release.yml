name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: verify node-${{ matrix.node-version }} stylelint-${{ matrix.stylelint-version }}
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
        stylelint-version: ['16.0.0', '16', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community scales
        run: npm run scales:validate

      - name: Pin Stylelint version from matrix
        run: npm install --no-save stylelint@${{ matrix.stylelint-version }}

      - name: Lint
        run: npm run lint

      - name: Test (Stylelint floor compat)
        if: matrix.stylelint-version == '16.0.0'
        run: npm run test:compat-floor

      - name: Test (full suite)
        if: matrix.stylelint-version != '16.0.0'
        run: npm test

      - name: Coverage (single reference run)
        if: matrix.node-version == '20.x' && matrix.stylelint-version == '16'
        run: npm run test:coverage

      - name: Pack smoke test (single reference run)
        if: matrix.node-version == '20.x' && matrix.stylelint-version == '16'
        run: npm run test:pack-smoke

  publish:
    needs: verify
    # npm trusted publishing (OIDC) is only supported from GitHub-hosted runners, so this
    # one small job runs on ubuntu-latest while the verify matrix stays on the farm.
    # No npm token: the trusted publisher on npmjs.com is bound to this repo and this
    # workflow file. Provenance is generated automatically; --provenance is not needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm via OIDC
        run: npm publish --access public --registry https://registry.npmjs.org
