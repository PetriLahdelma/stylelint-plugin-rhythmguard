name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: verify node-${{ matrix.node-version }} stylelint-${{ matrix.stylelint-version }}
    # The verify matrix runs on the self-hosted farm. When the farm is down (both
    # hosts offline, as before the 3.7.0 cut, which then waited 24 hours and was
    # cancelled), set the repository variable RELEASE_ON_HOSTED to "true" and the
    # release runs on GitHub-hosted runners instead; no workflow edit or re-cut.
    runs-on: ${{ vars.RELEASE_ON_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted", "stylelint-plugin-rhythmguard"]') }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
        stylelint-version: ['16.0.0', '16', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community scales
        run: npm run scales:validate

      - name: Pin Stylelint version from matrix
        run: npm install --no-save stylelint@${{ matrix.stylelint-version }}

      - name: Lint
        run: npm run lint

      - name: Test (Stylelint floor compat)
        if: matrix.stylelint-version == '16.0.0'
        run: npm run test:compat-floor

      - name: Test (full suite)
        if: matrix.stylelint-version != '16.0.0'
        run: npm test

      - name: Coverage (single reference run)
        if: matrix.node-version == '20.x' && matrix.stylelint-version == '16'
        run: npm run test:coverage

      - name: Pack smoke test (single reference run)
        if: matrix.node-version == '20.x' && matrix.stylelint-version == '16'
        run: npm run test:pack-smoke

  publish:
    needs: verify
    # npm trusted publishing (OIDC) is only supported from GitHub-hosted runners.
    # No npm token: the trusted publisher on npmjs.com is bound to this repo and this
    # workflow file. Provenance is generated automatically; --provenance is not needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm via OIDC
        run: npm publish --access public --registry https://registry.npmjs.org

      # The companion packages (rhythmguard, the command name; eslint-plugin-rhythmguard,
      # the ESLint companion under its own name) depend on the version published above,
      # so the registry must list it first (propagation takes a few minutes). Gated on
      # a repository variable until both packages exist on npm with a trusted publisher
      # bound to this workflow; the first publish of each is a manual `npm publish` by
      # the maintainer (docs/RELEASE_CHECKLIST.md).
      - name: Wait for the registry to list the version
        if: vars.PUBLISH_COMPANIONS == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/stylelint-plugin-rhythmguard?t=$(date +%s)" \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.exit(JSON.parse(d).versions[process.argv[1]]?0:1))' "$version"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::stylelint-plugin-rhythmguard@$version not on the registry after ten minutes"
          exit 1

      - name: Publish rhythmguard to npm via OIDC
        if: vars.PUBLISH_COMPANIONS == 'true'
        working-directory: packages/rhythmguard
        run: npm publish --access public --registry https://registry.npmjs.org

      - name: Publish eslint-plugin-rhythmguard to npm via OIDC
        if: vars.PUBLISH_COMPANIONS == 'true'
        working-directory: packages/eslint-plugin-rhythmguard
        run: npm publish --access public --registry https://registry.npmjs.org
