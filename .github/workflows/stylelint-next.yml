name: Hosts at latest

# Weekly early warning (#168, eb-10). Each host the rules run in, at its newest
# release, in its own job so one failure does not hide another:
#   - Stylelint and ESLint (the companion rules): `next` when it is ahead of
#     `latest`, else `latest` (scripts/ci/newest-tag.mjs)
#   - Oxlint: `latest`, whose ESLint-compatible JS plugins are still alpha
# A failure here never blocks a merge or a release; it says what to fix on main
# before a peer range has to widen or a pin has to move. GitHub-hosted, so it
# does not queue behind the farm.
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

concurrency:
  group: hosts-at-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stylelint:
    name: node-24 stylelint next or latest
    if: github.repository == 'PetriLahdelma/stylelint-plugin-rhythmguard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stylelint 18 requires Node ^22.22.2 || ^24.15.0 || >=26.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Install the newest Stylelint
        run: |
          tag=$(node scripts/ci/newest-tag.mjs stylelint)
          npm install --no-save "stylelint@$tag"
          echo "Testing against stylelint $(node -p "require('stylelint/package.json').version") ($tag)"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  eslint:
    name: node-24 eslint next or latest (companion rules)
    if: github.repository == 'PetriLahdelma/stylelint-plugin-rhythmguard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install the newest ESLint
        run: |
          tag=$(node scripts/ci/newest-tag.mjs eslint)
          npm install --no-save "eslint@$tag"
          echo "Testing against eslint $(node -p "require('eslint/package.json').version") ($tag)"
      - name: ESLint rule tests
        run: node --test test/rules/eslint-tailwind.test.js test/rules/eslint-tailwind-templates.test.js test/rules/eslint-tailwind-escapes.test.js test/rules/note-option.test.js test/unit/eslint-utility-functions.test.js test/contracts/eslint-samples.test.js

  oxlint:
    name: node-24 oxlint latest (JS plugins)
    if: github.repository == 'PetriLahdelma/stylelint-plugin-rhythmguard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install the latest Oxlint
        run: |
          npm install --no-save oxlint@latest
          echo "Testing against oxlint $(node -p "require('oxlint/package.json').version")"
      - name: Oxlint JS plugin tests
        run: node --test test/contracts/oxlint-jsplugin.test.js
