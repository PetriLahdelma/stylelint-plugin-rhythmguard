name: Stylelint next

# Weekly early warning (#168). Installs the newest Stylelint over the lockfile and
# runs the full suite: the `next` dist-tag while a major is in prerelease, else
# `latest` (18.0.0 since 2026-11-03, when `next` was removed). A failure here never
# blocks a merge or a release; it says what to fix on main before the peer range
# has to widen.
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

concurrency:
  group: stylelint-next
  cancel-in-progress: true

jobs:
  next:
    name: node-24 stylelint next or latest
    if: github.repository == 'PetriLahdelma/stylelint-plugin-rhythmguard'
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - uses: actions/checkout@v7

      # Stylelint 18 requires Node ^22.22.2 || ^24.15.0 || >=26.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Install the newest Stylelint
        run: |
          if npm view stylelint@next version --registry https://registry.npmjs.org >/dev/null 2>&1; then tag=next; else tag=latest; fi
          npm install --no-save "stylelint@$tag"
          echo "Testing against stylelint $(node -p "require('stylelint/package.json').version") ($tag)"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
