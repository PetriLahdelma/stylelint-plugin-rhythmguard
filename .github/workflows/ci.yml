name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'assets/**', 'agents/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'assets/**', 'agents/**']
  workflow_dispatch:

# A newer commit on the same branch makes the older run's result irrelevant.
# Cancelling it keeps the two-runner farm from queueing a day's worth of merges.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: node-${{ matrix.node-version }} stylelint-${{ matrix.stylelint-version }}
    # Self-hosted CI farm (owned hardware). PUBLIC repo: fork PRs must NEVER run on our
    # runners, so gate to same-repo PRs (and pushes) only. With the repository variable
    # HOSTED_GATE set to "true", same-repo PRs get the hosted fast gate below instead and
    # the farm runs this matrix on pushes to main only (trial, council Amendment 2).
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && vars.HOSTED_GATE != 'true')
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
        stylelint-version: ['16.7.0', '16', '17']
        # Node 20 is end of life (2026-04-30) but still the engines floor until 4.0:
        # one row runs the full suite there, on Stylelint 17. The Stylelint floor
        # (16.7.0) is proven on Node 22.
        exclude:
          - node-version: '20.x'
            stylelint-version: '16.7.0'
          - node-version: '20.x'
            stylelint-version: '16'
        # Stylelint 18 needs Node ^22.22.2 || ^24.15.0 || >=26, so it runs on Node 22,
        # 24 and 26 only; the Stylelint 16 rows prove the floor, and running every
        # major on every Node would double the farm's queue for no extra coverage (#164).
        include:
          - node-version: '22.x'
            stylelint-version: '18'
          - node-version: '24.x'
            stylelint-version: '18'
          - node-version: '26.x'
            stylelint-version: '18'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 26 for Linux links libatomic.so.1, which the stock actions-runner image
      # lacks on both farm hosts (arm64 Mac mini, x64 gaming PC): setup-node finds
      # the binary and it exits 127.
      - name: Install libatomic for Node 26 on Linux
        if: matrix.node-version == '26.x' && runner.os == 'Linux'
        run: |
          if ! ldconfig -p | grep -q libatomic.so.1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libatomic1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community scales
        run: npm run scales:validate

      - name: Pin Stylelint version from matrix
        run: npm install --no-save stylelint@${{ matrix.stylelint-version }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Stylelint floor compat)
        if: matrix.stylelint-version == '16.7.0'
        run: npm run test:compat-floor

      - name: Test (full suite)
        if: matrix.stylelint-version != '16.7.0'
        run: npm test

      - name: Coverage (single reference run)
        if: matrix.node-version == '22.x' && matrix.stylelint-version == '17'
        run: npm run test:coverage

      - name: Pack smoke test (single reference run)
        if: matrix.node-version == '22.x' && matrix.stylelint-version == '17'
        run: npm run test:pack-smoke

      - name: Report CI result to dashboard collector
        if: always()   # report pass AND fail; the reporting step can never fail the gate
        env:
          CI_COLLECTOR_URL: ${{ vars.CI_COLLECTOR_URL }}
          CI_COLLECTOR_TOKEN: ${{ secrets.CI_COLLECTOR_TOKEN }}
          CI_REPORT_NODE: ${{ runner.name }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/report-ci.sh

  # The ESLint companion is developed on ESLint 10 (the lockfile). Its peer range is
  # >=8, so the rule tests also run on ESLint 9, the version most projects still pin.
  eslint-9:
    name: eslint-9 companion rules (node-22)
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && vars.HOSTED_GATE != 'true')
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Pin ESLint 9
        run: npm install --no-save eslint@9 @eslint/js@9
      - name: ESLint rule tests
        run: node --test test/rules/eslint-tailwind.test.js test/rules/eslint-tailwind-templates.test.js test/rules/eslint-tailwind-escapes.test.js test/rules/note-option.test.js test/unit/eslint-utility-functions.test.js test/contracts/eslint-samples.test.js

  # The ESLint rules through Oxlint's JS plugins (alpha), on TSX, at a pinned
  # Oxlint version (#327). The test skips everywhere else, where Oxlint is not
  # installed. Bump the pin deliberately and update the version in the docs.
  oxlint:
    name: oxlint companion rules (oxlint-1.88.0, node-22)
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && vars.HOSTED_GATE != 'true')
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install Oxlint
        run: npm install --no-save oxlint@1.88.0
      - name: Oxlint JS plugin tests
        run: node --test test/contracts/oxlint-jsplugin.test.js

  # Fork PRs cannot use the self-hosted farm (public repo, untrusted code), so
  # contributors get feedback from one GitHub-hosted job: lint, typecheck, tests.
  # With HOSTED_GATE set to "true" it also runs for same-repo PRs, as an advisory
  # fast gate: continue-on-error, no ruleset requires it, and the local gate stays
  # the merge gate. Two hangs in a month revert the variable (council Amendment 2).
  fork-verify:
    name: PR fast gate (GitHub-hosted, node-22, Stylelint from the lockfile)
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || vars.HOSTED_GATE == 'true')
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Windows, GitHub-hosted, on pushes to main only. Paths are normalised in many
  # places that no Linux runner exercises (#174). Non-blocking until it is green
  # for a month; then README's compatibility line names Windows.
  windows:
    name: windows (GitHub-hosted, node-22)
    if: github.event_name == 'push'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
