name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'assets/**', 'agents/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'assets/**', 'agents/**']
  workflow_dispatch:

# A newer commit on the same branch makes the older run's result irrelevant.
# Cancelling it keeps the two-runner farm from queueing a day's worth of merges.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node-${{ matrix.node-version }} stylelint-${{ matrix.stylelint-version }}
    # Self-hosted CI farm (owned hardware) instead of metered GitHub-hosted minutes. PUBLIC repo:
    # fork PRs must NEVER run on our runners, so gate to same-repo PRs (and pushes) only.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
        stylelint-version: ['16.0.0', '16', '17']
        # Node 24 (active LTS) and 26 (LTS from 2026-10-28) on the current Stylelint only:
        # the Stylelint 16 rows prove the floor, and running them on every Node would
        # double the farm's queue for no extra coverage (#164).
        include:
          - node-version: '24.x'
            stylelint-version: '17'
          - node-version: '26.x'
            stylelint-version: '17'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 26 for linux-arm64 links libatomic.so.1, which the stock actions-runner
      # image on the Mac mini host lacks: setup-node finds the binary and it exits 127.
      - name: Install libatomic for Node 26 on arm64
        if: matrix.node-version == '26.x' && runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          if ! ldconfig -p | grep -q libatomic.so.1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libatomic1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community scales
        run: npm run scales:validate

      - name: Pin Stylelint version from matrix
        run: npm install --no-save stylelint@${{ matrix.stylelint-version }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Stylelint floor compat)
        if: matrix.stylelint-version == '16.0.0'
        run: npm run test:compat-floor

      - name: Test (full suite)
        if: matrix.stylelint-version != '16.0.0'
        run: npm test

      - name: Coverage (single reference run)
        if: matrix.node-version == '20.x' && matrix.stylelint-version == '16'
        run: npm run test:coverage

      - name: Pack smoke test (single reference run)
        if: matrix.node-version == '20.x' && matrix.stylelint-version == '16'
        run: npm run test:pack-smoke

      - name: Report CI result to dashboard collector
        if: always()   # report pass AND fail; the reporting step can never fail the gate
        env:
          CI_COLLECTOR_URL: ${{ vars.CI_COLLECTOR_URL }}
          CI_COLLECTOR_TOKEN: ${{ secrets.CI_COLLECTOR_TOKEN }}
          CI_REPORT_NODE: ${{ runner.name }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/report-ci.sh

  # The ESLint companion is developed on ESLint 10 (the lockfile). Its peer range is
  # >=8, so the rule tests also run on ESLint 9, the version most projects still pin.
  eslint-9:
    name: eslint-9 companion rules (node-22)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Pin ESLint 9
        run: npm install --no-save eslint@9 @eslint/js@9
      - name: ESLint rule tests
        run: node --test test/rules/eslint-tailwind.test.js test/rules/eslint-tailwind-templates.test.js test/rules/eslint-tailwind-escapes.test.js test/rules/note-option.test.js test/unit/eslint-utility-functions.test.js test/contracts/eslint-samples.test.js

  # Fork PRs cannot use the self-hosted farm (public repo, untrusted code), so
  # contributors get feedback from one GitHub-hosted job: lint, typecheck, tests.
  fork-verify:
    name: fork PR verify (GitHub-hosted, node-22, Stylelint from the lockfile)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
