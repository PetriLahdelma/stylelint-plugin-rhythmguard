name: Community Scales

on:
  push:
    branches: [main]
    paths:
      - 'scales/community/**'
      - 'schemas/community-scale.schema.json'
      - 'scripts/scales/**'
      - '.github/workflows/community-scales.yml'
  pull_request:
    paths:
      - 'scales/community/**'
      - 'schemas/community-scale.schema.json'
      - 'scripts/scales/**'
      - '.github/workflows/community-scales.yml'

permissions:
  contents: read

jobs:
  validate-community-scales:
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate community scales
        run: node scripts/scales/validate-community-scales.mjs
