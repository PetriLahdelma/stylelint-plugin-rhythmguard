name: Quiet Benchmark

on:
  # Main only. A run clones 57 repositories and holds one of the farm's two
  # runners for a long time, so it does not run on pull requests: the maintainer
  # runs `npm run bench:quiet -- --check` locally before merging (the release
  # checklist requires it), and fork PRs never reach the farm. Running it on the
  # PR and again on main doubled the queue and delayed releases (2026-10-30).
  push:
    branches: [main]
    # The benchmark only moves when the rules, inference, the manifest or the
    # dependencies move.
    paths: ['src/**', 'benchmarks/quiet/**', 'scripts/bench/**', 'package-lock.json', '.github/workflows/quiet-benchmark.yml']
  schedule:
    # Weekly: audit upstream HEADs to spot new drift or inference regressions early.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: quiet-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: findings match snapshots (pinned commits)
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quiet benchmark against pinned commits
        run: npm run bench:quiet -- --check

  upstream:
    name: upstream HEADs (informational)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quiet benchmark against upstream HEADs
        run: npm run bench:quiet -- --latest --check
