name: Post Publish Smoke

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: npm package version to smoke test. Defaults to package.json.
        required: false
        type: string
      ref:
        description: Git ref to check out before running the smoke test. Defaults to the workflow ref.
        required: false
        type: string

jobs:
  npm-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runs where the release verify runs: GitHub-hosted, or the farm when RELEASE_ON_FARM is "true".
    runs-on: ${{ vars.RELEASE_ON_FARM == 'true' && fromJSON('["self-hosted", "stylelint-plugin-rhythmguard"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout published commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 so the plugin's smoke reaches Stylelint 18, which needs Node 22.22 or newer.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: pkg
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./package.json').version")"
          fi

          if [ -z "$version" ]; then
            echo "::error::Package version could not be resolved."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The registry can take a few minutes to list a version after `npm publish`
      # returns (3.7.1 took three), and the release run that triggers this
      # workflow completes before that. Poll through npm itself, online, until
      # the same client that will install the packages can resolve the version:
      # for 3.8.0 the raw packument listed it a minute before npm install could
      # find it. Up to ten minutes before calling it unpublished. The release
      # publishes all three packages at one version, so wait for each.
      - name: Wait for the version on the npm registry
        id: registry
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          for pkg in stylelint-plugin-rhythmguard rhythmguard eslint-plugin-rhythmguard; do
            found=false
            for attempt in $(seq 1 40); do
              if npm view "$pkg@$VERSION" version --registry https://registry.npmjs.org --prefer-online >/dev/null 2>&1; then
                echo "$pkg@$VERSION is on the registry (attempt $attempt)."
                found=true
                break
              fi
              echo "$pkg@$VERSION not resolvable yet (attempt $attempt of 40); waiting 15s."
              sleep 15
            done
            if [ "$found" != true ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Skip smoke because a package is not published
        if: steps.registry.outputs.available != 'true'
        run: |
          echo "A package at ${{ steps.pkg.outputs.version }} is not on npm."
          echo "Skipping npm-registry smoke test."

      # Each package in a clean project with only what its README says to
      # install: Stylelint for the plugin, nothing for the CLI (it brings
      # Stylelint), ESLint without Stylelint for the ESLint plugin.
      - name: 'Smoke: stylelint-plugin-rhythmguard (install + lint)'
        if: steps.registry.outputs.available == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: node scripts/ci/npm-registry-smoke.mjs --package stylelint-plugin-rhythmguard --version "$VERSION"

      - name: 'Smoke: rhythmguard (install + audit)'
        if: steps.registry.outputs.available == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: node scripts/ci/npm-registry-smoke.mjs --package rhythmguard --version "$VERSION"

      - name: 'Smoke: eslint-plugin-rhythmguard (install + lint, no Stylelint)'
        if: steps.registry.outputs.available == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: node scripts/ci/npm-registry-smoke.mjs --package eslint-plugin-rhythmguard --version "$VERSION"
