name: Post Publish Smoke

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: npm package version to smoke test. Defaults to package.json.
        required: false
        type: string
      ref:
        description: Git ref to check out before running the smoke test. Defaults to the workflow ref.
        required: false
        type: string

jobs:
  npm-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, stylelint-plugin-rhythmguard]
    steps:
      - name: Checkout published commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: pkg
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./package.json').version")"
          fi

          if [ -z "$version" ]; then
            echo "::error::Package version could not be resolved."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check package visibility on npm registry
        id: registry
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "stylelint-plugin-rhythmguard@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip smoke because package is not published
        if: steps.registry.outputs.available != 'true'
        run: |
          echo "Package stylelint-plugin-rhythmguard@${{ steps.pkg.outputs.version }} is not on npm."
          echo "Skipping npm-registry smoke test."

      - name: npm install + lint smoke test
        if: steps.registry.outputs.available == 'true'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: node scripts/ci/npm-registry-smoke.mjs --package stylelint-plugin-rhythmguard --version "$VERSION"
